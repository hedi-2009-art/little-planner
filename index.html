<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff5f7"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><title>برنامه کوچولوی من</title><style>
:root{--p:#e99bb2;--pale:#f8dce5;--ink:#55434a;--muted:#967e86}*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#fff5f7,#fffaf3);color:var(--ink);font-family:Tahoma,Arial;min-height:100vh}.wrap{max-width:740px;margin:auto;padding:22px 15px 50px}.top,.datebar,.head{display:flex;align-items:center;justify-content:space-between;gap:10px}.top{margin-bottom:18px}h1{font-size:24px;margin:0 0 5px}.sub{font-size:12px;color:var(--muted)}.flower{font-size:32px;background:white;padding:12px;border-radius:18px}.panel{background:#ffffffdf;border:1px solid #f2e3e5;border-radius:21px;padding:15px;margin:13px 0;box-shadow:0 7px 22px #c99eaa18}button,input,select{font:inherit}button{border:0;border-radius:12px;padding:9px 13px;background:var(--pale);color:#694b56;cursor:pointer}button.primary{background:var(--p);color:white;font-weight:bold}button.small{font-size:12px;padding:7px 10px}input:not([type=checkbox]),select{width:100%;min-width:0;border:1px solid #ead9de;border-radius:12px;padding:11px;background:#fff;color:var(--ink)}.form{display:grid;grid-template-columns:1fr 120px;gap:9px}.wide{grid-column:1/-1}.tabs{display:flex;gap:8px;margin:13px 0}.tabs .active{background:var(--p);color:white}.head{margin:6px 2px 9px}.head h2{font-size:16px;margin:0}.progress{height:9px;background:#f5e8eb;border-radius:20px;overflow:hidden;margin-top:10px}.bar{height:100%;background:linear-gradient(90deg,#e99bb2,#b9cdb3);width:0}.task{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #f3e8e9;border-radius:15px;padding:11px;margin:8px 0}.task.done{opacity:.65;background:#f8fbf7}.task.done .name{text-decoration:line-through}.tick{width:22px;height:22px;accent-color:#8aa98d;flex:none}.body{flex:1;min-width:0}.name{font-size:14px;overflow-wrap:anywhere}.meta{font-size:11px;color:var(--muted);margin-top:5px}.tag{background:#fff0f4;padding:3px 7px;border-radius:8px;margin-left:4px}.actions{display:flex;gap:4px}.actions button{font-size:11px;padding:6px}.empty{text-align:center;padding:25px;color:var(--muted);font-size:13px}.hidden{display:none!important}.footer{text-align:center;color:#aa929a;font-size:11px;margin-top:25px}@media(max-width:480px){.wrap{padding:17px 11px}.form{grid-template-columns:1fr 100px}h1{font-size:21px}}
</style></head><body><main class="wrap"><header class="top"><div><h1>برنامه کوچولوی من 🌷</h1><div class="sub">آروم و قدم‌به‌قدم؛ فقط برنامه‌ریزی و تیک زدن</div></div><div class="flower">🧸</div></header>
<section class="panel"><div class="datebar"><button id="prev" class="small">روز قبل</button><b id="dateLabel"></b><button id="next" class="small">روز بعد</button></div><div class="progress"><div id="bar" class="bar"></div></div><div class="sub" id="progressText" style="margin-top:8px"></div></section>
<div class="tabs"><button id="dayTab" class="active">برنامه روزانه</button><button id="weekTab">نمای هفته</button></div>
<section id="addPanel" class="panel"><div class="head"><h2 id="formTitle">افزودن کار جدید ✨</h2><button id="cancel" class="small hidden">لغو ویرایش</button></div><form id="form" class="form"><input id="name" class="wide" maxlength="90" placeholder="مثلاً مرور درس امروز..." required><select id="cat"><option>درس و کنکور</option><option>آمادگی مدرسه</option><option>تکلیف و مرور</option><option>زبان انگلیسی</option><option>قلاب‌بافی</option><option>طراحی</option><option>مطالعه آزاد</option><option>استراحت</option><option>سایر</option></select><select id="priority"><option>مهم</option><option selected>معمولی</option><option>اختیاری</option></select><label class="sub wide"><input id="repeat" type="checkbox"> تکرار هفتگی در همین روز</label><button id="saveBtn" class="primary wide">اضافه کن</button></form></section>
<section id="dayView"><div class="head"><h2>کارهای این روز</h2><span class="sub" id="count"></span></div><div id="tasks"></div></section><section id="weekView" class="hidden"><div class="head"><h2>نگاه کلی به هفته</h2><span class="sub">شنبه تا جمعه</span></div><div id="week"></div></section><div class="footer">اطلاعات روی همین دستگاه ذخیره می‌شود 💗</div></main>
<script>
const $=x=>document.getElementById(x),days=['یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه','شنبه'],months=['ژانویه','فوریه','مارس','آوریل','مه','ژوئن','ژوئیه','اوت','سپتامبر','اکتبر','نوامبر','دسامبر'];let date=new Date(),items=JSON.parse(localStorage.getItem('lp-data')||'[]'),editing=null;date.setHours(12,0,0,0);const key=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-'),save=()=>localStorage.setItem('lp-data',JSON.stringify(items)),label=d=>`${days[d.getDay()]}، ${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`,forDay=d=>items.filter(t=>t.date===key(d)||(t.repeat&&t.day===d.getDay()&&t.date<=key(d)));
function render(){ $('dateLabel').textContent=label(date);let list=forDay(date),done=list.filter(t=>t.done===key(date)).length;$('bar').style.width=(list.length?done/list.length*100:0)+'%';$('progressText').textContent=`${done} از ${list.length} کار انجام شده`;$('count').textContent=`${list.length} کار`;$('tasks').innerHTML='';if(!list.length)$('tasks').innerHTML='<div class="panel empty">هنوز کاری برای این روز نچیدی.<br>یک کار کوچولو اضافه کن 🌸</div>';list.forEach(t=>{let el=document.createElement('div'),checked=t.done===key(date);el.className='task'+(checked?' done':'');el.innerHTML='<input class="tick" type="checkbox"><div class="body"><div class="name"></div><div class="meta"><span class="tag"></span><span class="tag"></span></div></div><div class="actions"><button class="edit">ویرایش</button><button class="del">×</button></div>';el.querySelector('.tick').checked=checked;el.querySelector('.name').textContent=t.name;el.querySelectorAll('.tag')[0].textContent=t.cat;el.querySelectorAll('.tag')[1].textContent=t.priority+(t.repeat?' · هفتگی':'');el.querySelector('.tick').onchange=e=>{t.done=e.target.checked?key(date):null;save();render()};el.querySelector('.edit').onclick=()=>edit(t);el.querySelector('.del').onclick=()=>{if(confirm('این کار حذف شود؟')){items=items.filter(x=>x.id!==t.id);save();render()}};$('tasks').append(el)});renderWeek()}
function renderWeek(){let start=new Date(date);start.setDate(start.getDate()-(start.getDay()+1)%7);$('week').innerHTML='';for(let i=0;i<7;i++){let d=new Date(start);d.setDate(start.getDate()+i);let a=forDay(d),n=a.filter(t=>t.done===key(d)).length,el=document.createElement('div');el.className='task';el.innerHTML='<div class="body"><div class="name"></div><div class="meta"></div></div><b></b>';el.querySelector('.name').textContent=label(d);el.querySelector('.meta').textContent=a.length?`${n} از ${a.length} انجام شده`:'بدون برنامه';el.querySelector('b').textContent=a.length?Math.round(n/a.length*100)+'٪':'—';el.onclick=()=>{date=d;$('dayTab').click();render()};$('week').append(el)}}
function reset(){editing=null;$('form').reset();$('formTitle').textContent='افزودن کار جدید ✨';$('saveBtn').textContent='اضافه کن';$('cancel').classList.add('hidden')}function edit(t){editing=t.id;$('name').value=t.name;$('cat').value=t.cat;$('priority').value=t.priority;$('repeat').checked=t.repeat;$('formTitle').textContent='ویرایش کار';$('saveBtn').textContent='ذخیره تغییرات';$('cancel').classList.remove('hidden');scrollTo(0,0)}
$('form').onsubmit=e=>{e.preventDefault();let v={name:$('name').value.trim(),cat:$('cat').value,priority:$('priority').value,repeat:$('repeat').checked,day:date.getDay()};if(!v.name)return;if(editing)Object.assign(items.find(t=>t.id===editing),v);else items.push({...v,id:String(Date.now())+Math.random(),date:key(date),done:null});save();reset();render()};$('cancel').onclick=reset;$('prev').onclick=()=>{date.setDate(date.getDate()-1);render()};$('next').onclick=()=>{date.setDate(date.getDate()+1);render()};$('dayTab').onclick=()=>{$('dayTab').classList.add('active');$('weekTab').classList.remove('active');$('dayView').classList.remove('hidden');$('addPanel').classList.remove('hidden');$('weekView').classList.add('hidden')};$('weekTab').onclick=()=>{$('weekTab').classList.add('active');$('dayTab').classList.remove('active');$('dayView').classList.add('hidden');$('addPanel').classList.add('hidden');$('weekView').classList.remove('hidden')};if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});render();
</script></body></html>
